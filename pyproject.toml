[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vidforge"
version = "0.1.0"
description = "Local video upscaling, face enhancement, subtitles and dubbing for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "numpy>=2",
    "onnx>=1.17",                   # builds Real-ESRGAN graphs from the official weights
    "onnxruntime-directml>=1.24",   # runs them on any DirectX 12 GPU
    "pywinpty>=2.0; sys_platform == 'win32'",  # console for NVEncC's live progress
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vidforge = "vidforge.cli:main"

[project.gui-scripts]
vidforge-gui = "vidforge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
